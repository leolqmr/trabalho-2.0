version: '3.8'

services:
  # ---------------------------------------------------
  # BANCO DE DADOS (PostgreSQL)
  # ---------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: frequencia-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: frequencia_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - frequencia-net

  # ---------------------------------------------------
  # SERVIÇO DE AUTENTICAÇÃO (Keycloak)
  # ---------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: frequencia-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/frequencia_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgrespassword
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - frequencia-net

  # ---------------------------------------------------
  # BACKEND (NestJS + Prisma)
  # ---------------------------------------------------
  backend:
    build:
      context: ./frequencia-back
      dockerfile: Dockerfile
    container_name: frequencia-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/frequencia_db?schema=public"
      KEYCLOAK_URL: "http://keycloak:8080"
      PORT: 3000
    depends_on:
      - postgres
      - keycloak
    networks:
      - frequencia-net

  # ---------------------------------------------------
  # FRONTEND
  # ---------------------------------------------------
  frontend:
    build:
      context: ./frequencia-front
      dockerfile: Dockerfile
    container_name: frequencia-frontend
    restart: always
    ports:
      - "5173:5173" # Se for Vite/React usa 5173. Se for Next.js, altere para "3001:3000"
    depends_on:
      - backend
    networks:
      - frequencia-net

# ---------------------------------------------------
# REDES E VOLUMES PERSISTENTES
# ---------------------------------------------------
networks:
  frequencia-net:
    driver: bridge

volumes:
  postgres_data: