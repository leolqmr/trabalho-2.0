

services:
  # ---------------------------------------------------
  # BANCO DE DADOS (PostgreSQL)
  # ---------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: frequencia-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: frequencia_db
    ports:
      - "5433:5432" # Mapeia a porta 5433 da máquina host para a 5432 do container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frequencia_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - frequencia-net

  # ---------------------------------------------------
  # SERVIÇO DE AUTENTICAÇÃO (Keycloak)
  # ---------------------------------------------------

  keycloak-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_dev_password
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - frequencia-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: frequencia-keycloak
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev_password
    volumes:
      - ./frequencia-back/setup/realm.json:/opt/keycloak/data/import/realm.json:ro
    ports:
      - "8080:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks:
      - frequencia-net


  # ---------------------------------------------------
  # BACKEND (NestJS + Prisma)
  # ---------------------------------------------------
  backend:
    profiles: ["app"]
    build:
      context: ./frequencia-back
      dockerfile: Dockerfile
    container_name: frequencia-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/frequencia_db?schema=public"
      KEYCLOAK_URL: "http://keycloak:8080"
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - frequencia-net

  # ---------------------------------------------------
  # FRONTEND (React / Vite)
  # ---------------------------------------------------
  frontend:
    profiles: ["app"]
    build:
      context: ./frequencia-front
      dockerfile: Dockerfile
    container_name: frequencia-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - frequencia-net

# ---------------------------------------------------
# REDES E VOLUMES PERSISTENTES
# ---------------------------------------------------
networks:
  frequencia-net:
    driver: bridge

volumes:
  postgres_data:
  keycloak_data: